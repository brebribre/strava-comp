<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Locked scale and viewport-fit=cover: the app should feel installed rather than
         like a page — no pinch zoom, and the layout runs under the notch and home bar,
         where safe-area insets put the padding back. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bruderbande" />
    <meta name="theme-color" content="#0e1a16" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS uses this one for the home screen, manifest icons or not. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Bruderbande</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
